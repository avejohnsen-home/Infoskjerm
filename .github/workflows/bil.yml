name: Bil
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "Hva skal gjøres"
        required: false
        default: "status"
        type: choice
        options: [status, refresh, hvac-start, hvac-stop, charge-start]
      temp:
        description: "Temperatur for klima"
        required: false
        default: "21"
permissions:
  contents: write
concurrency:
  group: bil
  cancel-in-progress: false
jobs:
  bil:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node bil.mjs
        env:
          NISSAN_USER: ${{ secrets.NISSAN_USER }}
          NISSAN_PASSWORD: ${{ secrets.NISSAN_PASSWORD }}
          NISSAN_VIN: ${{ secrets.NISSAN_VIN }}
          CAR_KEY: ${{ secrets.CAR_KEY }}
          BIL_TOKEN: ${{ secrets.BIL_TOKEN }}
          ACTION: ${{ inputs.action || 'status' }}
          TEMP: ${{ inputs.temp || '21' }}
      - run: |
          git config user.name "infoskjerm-bot"
          git config user.email "actions@users.noreply.github.com"
          git add bil.enc.json bil-token.enc 2>/dev/null || true
          git diff --staged --quiet && exit 0
          git commit -m "Oppdater bil"
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 7; done
          exit 1
