name: Oppdater data
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  oppdater:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: node fetch.mjs
        env:
          TICKETMASTER_KEY: ${{ secrets.TICKETMASTER_KEY }}
      - run: |
          git config user.name "infoskjerm-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet && exit 0
          git commit -m "Oppdater data"
          git pull --rebase origin main
          git push
