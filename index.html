<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Infoskjerm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6ECEF; --surface:#F7FAFB; --ink:#17222C; --muted:#5B6873;
  --tram:#2C64A8; --signal:#E9B437; --line:#CBD5DB;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121B23; --surface:#1B2731; --ink:#E7EEF2; --muted:#9AA8B3;
    --tram:#6FA3E0; --signal:#F0C352; --line:#2C3A46;
  }
}
:root[data-theme="dark"]{
  --bg:#121B23; --surface:#1B2731; --ink:#E7EEF2; --muted:#9AA8B3;
  --tram:#6FA3E0; --signal:#F0C352; --line:#2C3A46;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:560px;margin:0 auto;padding:18px 18px 28px}

/* Header: klokke + vær */
.top{display:grid;grid-template-columns:1fr auto;align-items:end;gap:8px}
.clock{font-size:clamp(64px,22vw,104px);font-weight:800;line-height:.9;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.date{font-size:17px;color:var(--muted);margin-top:6px}
.now{text-align:right}
.now .temp{font-size:44px;font-weight:600;line-height:1}
.now .cond{font-size:15px;color:var(--muted)}
.place{font-size:13px;color:var(--muted);margin-top:2px}
.hours{display:flex;gap:6px;margin:16px 0 4px;overflow-x:auto;padding-bottom:4px}
.hour{flex:1 0 52px;background:var(--surface);border-radius:12px;padding:8px 4px;text-align:center}
.hour b{display:block;font-size:13px;font-weight:600;color:var(--muted)}
.hour span{display:block;font-size:20px;margin:2px 0}
.hour i{font-style:normal;font-size:15px;font-weight:600}
.hour small{display:block;font-size:11px;color:var(--tram)}
.days{display:flex;gap:6px;margin:16px 0 4px;overflow-x:auto;padding-bottom:4px}
.day{appearance:none;border:0;font:inherit;color:inherit;flex:1 0 62px;background:var(--surface);border-radius:12px;padding:8px 4px;text-align:center;cursor:pointer}
.day b{display:block;font-size:13px;font-weight:600;color:var(--muted)}
.day span{display:block;font-size:22px;margin:2px 0}
.day i{font-style:normal;font-size:15px;font-weight:600}
.day i small{color:var(--muted);font-weight:400}
.day .rain{display:block;font-size:11px;color:var(--tram);min-height:1.3em}
.whead{padding:16px 16px 6px}
.whead h2{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em}
.whead p{margin:4px 0 0;color:var(--muted);font-size:14px}
.wlist{max-height:58vh;overflow:auto;padding:0 16px}
.wrow{display:grid;grid-template-columns:44px 30px 44px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.wrow .t{color:var(--muted);font-variant-numeric:tabular-nums}
.wrow .c{font-weight:600}
.wrow .r{color:var(--tram);font-size:13px}
.wrow .w{color:var(--muted);font-size:13px;text-align:right}

.transit{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin:14px 0 0}
.stop{background:var(--surface);border-radius:12px;padding:10px 12px}
.stop h4{margin:0 0 6px;font-size:14px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between}
.dep{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:5px 0;border-top:1px solid var(--line);font-size:15px}
.dep:first-of-type{border-top:0}
.line{min-width:30px;text-align:center;font-weight:800;font-size:13px;color:#fff;border-radius:6px;padding:2px 6px}
.line.tram{background:#0B91EF}.line.bus{background:#E60000}
.dest{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.when{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.when.soon{color:var(--tram)}
.when small{font-weight:400;color:var(--muted);font-size:11px;margin-left:2px}
.quizbar{appearance:none;width:100%;text-align:left;font:inherit;color:inherit;margin:10px 0 0;background:var(--surface);border:0;border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;cursor:pointer}
.quizbar .qi{font-size:22px}
.quizbar b{display:block;font-size:15px}
.quizbar span.s{font-size:13px;color:var(--muted)}
.quizbar.tonight{outline:2px solid var(--signal)}
.slmbar{margin-top:8px}
.slmrow{display:block;text-decoration:none;color:inherit;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.slmrow b{display:block}
.slmrow small{color:var(--muted)}
.slmrow .tm{color:var(--tram);font-weight:600}
.qrow{padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.qrow b{display:block}
.qrow small{color:var(--muted)}
.qday{margin:12px 0 2px;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.demo{margin:14px 0 0;font-size:13px;color:var(--muted);background:var(--surface);border-left:4px solid var(--signal);padding:8px 10px;border-radius:6px}

/* Rotasjon */
.nav{display:flex;align-items:center;gap:8px;margin:22px 0 16px;border-bottom:1px solid var(--line)}
.tab{appearance:none;border:0;background:none;color:var(--muted);font:inherit;font-size:17px;font-weight:600;padding:6px 2px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--tram)}
.tab:focus-visible,button:focus-visible{outline:2px solid var(--tram);outline-offset:2px}
.status{margin-left:auto;font-size:12px;color:var(--muted)}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:16px}
.bar>div{height:100%;width:0;background:var(--tram)}
.slide{display:none}
.slide.on{display:block;animation:in .45s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Kultur */
.posters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
.poster{appearance:none;border:0;padding:0;min-width:0;width:100%;display:block;background:none;text-align:left;color:inherit;font:inherit;cursor:pointer}
.art{aspect-ratio:1/1;width:100%;border-radius:6px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;color:#fff}
.art h3{margin:0;font-size:22px;font-weight:800;line-height:1;letter-spacing:-.02em;position:relative}
.art .shape{position:absolute;inset:0}
.art img,.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.art .kind{z-index:1}
.meta{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.3;min-height:4.9em}
.meta .where{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta b{display:-webkit-box!important;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.filters{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding-bottom:4px}
.chip{appearance:none;flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;padding:6px 12px;border-radius:999px;cursor:pointer}
.secthead{grid-column:1/-1;font-size:20px;font-weight:800;letter-spacing:-.01em;margin:10px 0 0;padding-bottom:6px;border-bottom:2px solid var(--line)}
.secthead:first-child{margin-top:0}
.logo-art{display:flex;align-items:center;justify-content:center;background:#C9D1D8;padding:14%}
.logo-art .logo{position:static;width:100%;height:100%;object-fit:contain}
.logo-art.own{padding:0;background:transparent}
.logo-art.own .logo{object-fit:cover}
.logo-art.all{background:linear-gradient(135deg,var(--tram),#3B2E5A)}
.all-txt{color:#fff;font-weight:800;font-size:clamp(20px,5vw,30px);line-height:1.05;text-align:center}
.logo-txt{color:#17222C;font-weight:800;font-size:clamp(16px,4vw,24px);text-align:center;line-height:1.1}
.chip[aria-pressed="true"]{background:var(--tram);border-color:var(--tram);color:#fff}
#cities .chip{font-weight:600}
#venues .chip[aria-pressed="true"]{background:var(--signal);border-color:var(--signal);color:#17222C}
#cities .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.meta b{color:var(--ink);font-weight:600;display:block;font-size:14px}
.kind{display:inline-block;font-size:11px;font-weight:600;background:rgba(255,255,255,.88);color:#17222C;border-radius:4px;padding:2px 6px;position:absolute;top:10px;left:10px}

/* Tilbud */
.store{margin-bottom:16px}
.store h3{font-size:20px;margin:0 0 6px;display:flex;align-items:center;gap:8px}
.store h3 span{width:12px;height:12px;border-radius:50%}
.deal{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:16px}
.deal em{font-style:normal;font-weight:800;color:var(--tram);white-space:nowrap}
.deal s{color:var(--muted);font-size:13px;margin-left:6px}

/* Vin */
.wine{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.bottle{width:20px;height:64px;margin:0 auto;border-radius:6px 6px 4px 4px;position:relative}
.bottle::before{content:"";position:absolute;top:-14px;left:6px;width:8px;height:16px;border-radius:2px;background:inherit}
.wine h3{margin:0;font-size:17px}
.wine p{margin:2px 0 0;font-size:14px;color:var(--muted);line-height:1.35}
.wine .price{font-weight:800;font-size:17px;white-space:nowrap}

.src{font-size:12px;color:var(--muted);margin:14px 0 0;line-height:1.4}
.film{appearance:none;border:0;background:none;color:inherit;font:inherit;text-align:left;width:100%;display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.thumb{aspect-ratio:2/3;border-radius:4px;position:relative;overflow:hidden}
.film h3{margin:0;font-size:17px;line-height:1.2}
.film p{margin:3px 0 0;font-size:13px;color:var(--muted)}
.fdays{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding-bottom:4px}
.cin{margin:0 0 12px}
.cin b{display:block;font-size:15px;margin-bottom:6px}
.times{display:flex;flex-wrap:wrap;gap:6px}
.time{display:inline-block;background:var(--bg);color:var(--ink);text-decoration:none;border-radius:8px;padding:6px 9px;font-size:14px;font-variant-numeric:tabular-nums}
.time small{color:var(--muted);margin-left:4px}
.scores{display:flex;gap:8px;margin:0 0 12px;flex-wrap:wrap}
.score{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border-radius:8px;padding:6px 10px;font-weight:700;font-size:15px;text-decoration:none;color:var(--ink)}
.score small{font-weight:400;color:var(--muted);font-size:12px}
.trailerbtn{display:block;width:100%;appearance:none;border:0;background:#E60000;color:#fff;font:inherit;font-weight:600;font-size:16px;padding:12px;border-radius:10px;margin:0 0 10px;cursor:pointer}
.trailerbox{position:relative;width:100%;aspect-ratio:16/9;margin:0 0 10px;border-radius:10px;overflow:hidden;background:#000}
.trailerbox iframe,.trailerbox video{position:absolute;inset:0;width:100%;height:100%;border:0}
.link{display:block;text-align:center;margin:0 0 10px;padding:11px;border-radius:10px;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:600}
.link:focus-visible{outline:2px solid var(--tram);outline-offset:2px}
footer{margin-top:26px;display:flex;gap:16px;align-items:center;font-size:13px;color:var(--muted)}
footer button{appearance:none;background:none;border:1px solid var(--line);color:var(--ink);font:inherit;padding:6px 10px;border-radius:8px;cursor:pointer}

/* Se-liste */
.pcard{position:relative;min-width:0}
.fav{position:absolute;top:6px;right:6px;z-index:2;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.85);font-size:20px;line-height:1;cursor:pointer;display:grid;place-items:center;filter:grayscale(1);opacity:.7;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.fav[aria-pressed="true"]{background:var(--signal);filter:none;opacity:1}
.tab.wl{white-space:nowrap;margin-left:auto}
.tab.wl .n{display:inline-block;min-width:20px;margin-left:4px;padding:0 6px;border-radius:999px;background:var(--line);color:var(--ink);font-size:13px;text-align:center}
.tab.wl .n.has{background:var(--signal);color:#17222C}
.pcard.gone .art{filter:grayscale(1);opacity:.55}
.wlhead{margin:18px 0 8px;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.wlhead:first-child{margin-top:0}
.empty{background:var(--surface);border-radius:12px;padding:18px;color:var(--muted);line-height:1.45}
.mfav{display:block;width:100%;appearance:none;margin:0 0 10px;padding:11px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.mfav[aria-pressed="true"]{background:var(--signal);border-color:var(--signal);color:#17222C}
@media (max-width:520px){.status{display:none}}

/* Priser */
.prices{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px}
.price{display:inline-flex;flex-direction:column;background:var(--bg);border-radius:8px;padding:6px 10px;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.price small{font-weight:600;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.price.disc{background:var(--signal);color:#17222C}
.price.disc small{color:#17222C;opacity:.75}
.pnote{font-size:12px;color:var(--muted);margin:0 0 12px}

/* Vink */
.vrow{appearance:none;border:0;background:none;color:inherit;font:inherit;text-align:left;width:100%;display:grid;grid-template-columns:112px 1fr;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.vrow .thumb{aspect-ratio:4/3;border-radius:6px}
.vrow h3{margin:2px 0 0;font-size:17px;line-height:1.25}
.vrow .k{font-size:13px;font-weight:600;color:var(--tram)}
.vrow p{margin:4px 0 0;font-size:13px;color:var(--muted)}

/* Modal */
dialog{border:0;border-radius:14px;padding:0;max-width:min(92vw,440px);width:100%;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(10,16,22,.6)}
.mhead{height:120px;display:flex;align-items:flex-end;padding:14px;color:#fff;position:relative;overflow:hidden}
.mhead h2{margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em;position:relative}
.mbody{padding:14px 16px 18px}
.mbody p{margin:0 0 12px;line-height:1.45}
.dates{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px;padding:0;list-style:none}
.dates:has(.fdays){display:block}
.dates li{background:var(--bg);border-radius:8px;padding:6px 9px;font-size:14px}
.close{width:100%;appearance:none;border:0;background:var(--tram);color:#fff;font:inherit;font-weight:600;font-size:16px;padding:12px;border-radius:10px;cursor:pointer}

/* Skjermsparer */
.saver{position:fixed;inset:0;z-index:50;display:none;cursor:pointer;
  background:
   radial-gradient(60% 40% at 70% 28%, #F6C66B 0%, rgba(246,198,107,0) 70%),
   radial-gradient(90% 55% at 20% 75%, #2E5E7E 0%, rgba(46,94,126,0) 70%),
   linear-gradient(175deg,#E58A4E 0%,#C2554A 32%,#4D3E6B 58%,#1E3550 100%);}
.saver.on{display:block;animation:fade 1.2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.saver .hill{position:absolute;left:-10%;right:-10%;bottom:-8%;height:42%;background:#14263A;border-radius:50% 50% 0 0;opacity:.9}
.saver .layer{position:absolute;inset:0;opacity:0;transition:opacity 2s ease}
.saver .layer.show{opacity:1}
.saver .blur{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(30px) brightness(.225)}
.saver .pic{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;padding:0;filter:brightness(.5)} /* pausebildene dempet 50 % */
.saver::after{content:"";position:absolute;left:0;right:0;bottom:0;height:28%;background:linear-gradient(to top,rgba(0,0,0,.6),transparent);z-index:1;pointer-events:none}
.saver .sclock{position:absolute;left:24px;bottom:calc(28px + env(safe-area-inset-bottom,0px));color:#fff;font-size:56px;font-weight:800;letter-spacing:-.03em;text-shadow:0 2px 12px rgba(0,0,0,.35);z-index:2}
.saver .stemp{position:absolute;right:24px;bottom:calc(28px + env(safe-area-inset-bottom,0px));color:#fff;font-size:56px;font-weight:800;letter-spacing:-.03em;text-shadow:0 2px 12px rgba(0,0,0,.35);z-index:2}
.saver .cap{position:absolute;right:20px;bottom:calc(110px + env(safe-area-inset-bottom,0px));color:rgba(255,255,255,.85);font-size:13px;max-width:55%;text-align:right;line-height:1.35;z-index:2;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.saver .cap b{display:block;color:#fff;font-size:15px}



/* Infolinje: luft, sol, måne, søppel */
.infoline{appearance:none;width:100%;border:0;font:inherit;color:inherit;background:none;cursor:pointer;display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 0;padding:0;text-align:left}
.infoline:empty{display:none}
.ichip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border-radius:999px;padding:5px 11px;font-size:14px;white-space:nowrap}
.ichip .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.ichip.hot{outline:2px solid var(--signal)}
.ihead{margin:16px 0 6px;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.ihead:first-child{margin-top:0}
.aqbar{display:flex;gap:3px;margin:6px 0 2px}
.aqbar span{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.aqbar span i{display:block;height:22px;border-radius:4px;margin-bottom:3px}
.irow{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
.irow small{color:var(--muted)}

/* Merker på plakater */
.badges{position:absolute;top:40px;left:10px;z-index:3;display:flex;gap:4px;flex-wrap:wrap}
.badge{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--signal);color:#140E0A;line-height:1.2}
.badge.ut{background:#B3261E;color:#fff}
.badge.free{background:#3F9F41;color:#fff}
.ichip.warn{outline:2px solid var(--signal)}
.ichip.warn.oransje{outline-color:#E8833A}
.ichip.warn.rød{outline-color:#D63B3B}
.ilink{display:inline-block;margin-top:8px;color:var(--tram);font-weight:600}

/* Helg-fanen */
.wkday{margin:18px 0 8px;font-size:20px;font-weight:800;letter-spacing:-.01em;padding-bottom:6px;border-bottom:2px solid var(--line)}
.wkday:first-child{margin-top:0}
.hrow{appearance:none;width:100%;border:0;font:inherit;color:inherit;text-align:left;background:var(--surface);border-radius:12px;padding:8px;margin:0 0 8px;display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;cursor:pointer}
.hrow .th{position:relative;width:64px;height:64px;border-radius:9px;overflow:hidden;background:var(--line)}
.hrow .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hrow .th .ic{position:absolute;inset:0;display:grid;place-items:center;font-size:28px}
.hrow b{display:block;font-size:16px;line-height:1.25}
.hrow .t{font-size:13px;font-weight:600;color:var(--tram)}
.hrow small{display:block;color:var(--muted);font-size:13px;margin-top:2px}

/* Nattmodus */
.night{position:fixed;inset:0;z-index:60;display:none;background:#000;cursor:pointer;color:#B08A4E}
.night.on{display:block;animation:fade 1.5s ease}
.night .nbox{position:absolute;left:50%;top:var(--ny,40%);transform:translate(-50%,-50%);text-align:center;transition:top 3s ease}
.night .nclock{font-size:150px;font-weight:800;letter-spacing:-.04em;line-height:1}
.night .ndate{font-size:26px;opacity:.7;margin-top:8px}
.night .ntemp{font-size:54px;font-weight:700;margin-top:34px;opacity:.85}
.night .nnext{font-size:20px;opacity:.55;margin-top:10px}

@media (prefers-reduced-motion:reduce){
  .slide.on,.saver.on{animation:none}
}


/* ---- Mørk brun bakgrunn (fast, uansett lys/mørk modus) ---- */
:root{
  --bg:#140E0A !important; --surface:#231A14 !important; --ink:#F4ECE2 !important; --muted:#C4B3A2 !important;
  --line:#3B2E24 !important; --tram:#E4B36A !important; --signal:#F0C352 !important;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--ink)}
.chip[aria-pressed="true"],.close{color:#140E0A !important}
#cities .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#140E0A !important}
.when.soon{color:var(--tram)}

/* ---- Fyll hele skjermen (veggskjerm i stående format) ---- */
.wrap{max-width:none;padding:clamp(16px,3vw,36px) clamp(16px,3vw,36px) 28px}
.posters{grid-template-columns:repeat(auto-fill,minmax(min(200px,45%),1fr))}
.days .day{flex:1 1 0}
@media (min-width:700px){ body{zoom:1.2} }
@media (min-width:950px){ body{zoom:1.4} }
@media (min-width:1300px){ body{zoom:1.7} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="date"></div>
    </div>
    <div class="now">
      <div class="temp" id="nowTemp">–°</div>
      <div class="cond" id="nowCond">Henter vær …</div>
      <div class="place">Grünerløkka</div>
    </div>
  </header>
  <div class="days" id="days"></div>
  <button class="infoline" id="infoline" aria-label="Luft, sol, måne og søppel – trykk for detaljer"></button>
  <section class="transit" id="transit" aria-label="Avganger"></section>
  <button class="quizbar" id="quizbar" hidden></button>
  <button class="quizbar slmbar" id="slmbar" hidden></button>

  <section class="slide" id="s0">

  <section class="slide" id="s2">

    <p class="src" id="srcV"></p>

  <section class="slide" id="s5">

    <p class="src" id="srcW"></p>
  </section>

  <section class="slide" id="s3">

    <p class="src">Se-listen lagres på denne skjermen. Trykk 👀 igjen for å fjerne noe.</p>

  <section class="slide" id="s1">
    <div class="filters" id="fgenres" role="group" aria-label="Filtrer filmer"></div>

  <footer>

<script>
// ---------- Hjelpere ----------
const mon=["jan","feb","mar","apr","mai","jun","jul","aug","sep","okt","nov","des"];
const wd=["søn","man","tir","ons","tor","fre","lør"];
const days=["søndag","mandag","tirsdag","onsdag","torsdag","fredag","lørdag"];
const months=["januar","februar","mars","april","mai","juni","juli","august","september","oktober","november","desember"];
const cap=t=>t[0].toUpperCase()+t.slice(1);
const fmtD=d=>`${wd[d.getDay()]} ${d.getDate()}. ${mon[d.getMonth()]}`;
const fmtDT=d=>`${fmtD(d)} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
const fmtDay=d=>`${d.getDate()}. ${mon[d.getMonth()]}${d.getFullYear()!==new Date().getFullYear()?" "+d.getFullYear():""}`;
const fmtMm=n=>n?String(n).replace(".",",")+" mm":"";
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
function sym(c=""){const n=c.includes("night");
  if(c.startsWith("clearsky"))return n?"🌙":"☀️"; if(c.startsWith("fair"))return n?"🌙":"🌤"; if(c.startsWith("partlycloudy"))return "⛅";
  if(c.startsWith("cloudy"))return "☁️"; if(c.includes("thunder"))return "⛈"; if(c.includes("snow")||c.includes("sleet"))return "🌨";
  if(c.startsWith("fog"))return "🌫"; if(c.includes("showers"))return "🌦"; if(c.includes("rain"))return "🌧"; return "☁️"}
function symText(c=""){
  if(c.startsWith("clearsky"))return "Klarvær"; if(c.startsWith("fair"))return "Lettskyet"; if(c.startsWith("partlycloudy"))return "Delvis skyet";
  if(c.startsWith("cloudy"))return "Skyet"; if(c.includes("thunder"))return "Torden"; if(c.includes("sleet"))return "Sludd"; if(c.includes("snow"))return "Snø";
  if(c.startsWith("fog"))return "Tåke"; if(c.includes("showers"))return "Regnbyger"; if(c.startsWith("light"))return "Lett regn"; if(c.includes("rain"))return "Regn"; return ""}

// ---------- Tegnede reserveplakater (brukes hvis bilde mangler) ----------
const palettes=[["#1F3A5F","#E9B437"],["#8C2F39","#F3D9C4"],["#2E5E4E","#BFE3D0"],["#3B2E5A","#C9B8F0"],["#C2554A","#FBE3A1"],["#163A4C","#7FD3C4"],["#4A3B2A","#E8C9A0"],["#2B2D42","#EF8354"]];
const shapes=["circle","stripes","arc","split","dots"];
function hash(t){let h=0;for(const c of t)h=(h*31+c.charCodeAt(0))>>>0;return h}
function shapeBg(s,[a,b]){switch(s){
  case "circle":return `background:radial-gradient(circle at 65% 32%, ${b} 0 28%, transparent 29%), ${a}`;
  case "stripes":return `background:repeating-linear-gradient(135deg, ${a} 0 18px, ${b}33 18px 36px), ${a}`;
  case "arc":return `background:radial-gradient(120% 70% at 50% 110%, ${b} 0 40%, transparent 41%), ${a}`;
  case "split":return `background:linear-gradient(160deg, ${b} 0 38%, ${a} 38%)`;
  case "dots":return `background:radial-gradient(${b} 18%, transparent 19%) 0 0/26px 26px, ${a}`;}}
const styleFor=t=>{const h=hash(t);return shapeBg(shapes[h%shapes.length],palettes[(h>>>3)%palettes.length])};
function imgNext(el){const a=(el.dataset.alt||"").split("|").filter(Boolean);if(a.length){el.dataset.alt=a.slice(1).join("|");el.src=a[0]}else el.remove()}
const imgTag=(src,alts)=>src?`<img src="${esc(src)}" data-alt="${esc((alts||[]).join("|"))}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="imgNext(this)">`:"";
const headStyle=(t,img)=>img?`background:#222 url('${encodeURI(img)}') center/cover`:styleFor(t);

// ---------- Klokke ----------
function tick(){const d=new Date(),t=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  document.getElementById("clock").textContent=t;document.getElementById("sclock").textContent=t;
  document.getElementById("date").textContent=`${cap(days[d.getDay()])} ${d.getDate()}. ${months[d.getMonth()]}`;}
tick();setInterval(tick,1000);

// ---------- Eksempeldata: tilbud og vin ----------




// ---------- Rendering av ekte data ----------
let DATA=null;
function renderWeather(w){
  if(!w)return;
  document.getElementById("nowTemp").textContent=w.now.temp+"°";
  document.getElementById("nowCond").textContent=`${sym(w.now.sym)} ${symText(w.now.sym)}`;
  const el=document.getElementById("days"); el.innerHTML="";
  w.days.forEach((d,k)=>{const dt=new Date(d.date+"T12:00");
    const b=document.createElement("button");b.className="day";
    b.innerHTML=`<b>${k===0?"I dag":cap(wd[dt.getDay()])}</b><span>${sym(d.sym)}</span><i>${d.max}° <small>${d.min}°</small></i><em class="rain" style="font-style:normal">${fmtMm(d.rain)}</em>`;
    b.addEventListener("click",()=>openDay(d,k));el.appendChild(b);});
}
const CATS=["Alle","Teater","Musikal","Opera","Ballett","Revy og show","Konsert"];
let catFilter="Alle", cityFilter="Alle", venueFilter="Alle", theatreView="logos";
const theaterOf=s=>/^oslo nye/i.test(s.label)?"Oslo Nye Teater":s.label;
function catOf(s){
  if(s.genres&&s.genres.length){const g=s.genres.join(" ").toLowerCase();
    if(/ballett|ballet|dans/.test(g))return "Ballett"; if(/konsert|concert/.test(g))return "Konsert"; if(g.includes("opera"))return "Opera";}
  const t=[s.title,s.hint,s.about].join(" ").toLowerCase();
  if(/musikal|musical|saturday night fever|hairspray|chicago/.test(t))return "Musikal";
  if(/ballett|balett|ballet|on ice/.test(t))return "Ballett";
  if(/konsert|concert|in concert|tour|jul med|julekonsert/.test(t))return "Konsert";
  if(s.venue==="Chat Noir"||s.venue==="Latter"||/revy|stand-?up|komedie|show/.test(t))return "Revy og show";
  if(s.venue==="Operaen")return "Opera";
  return "Teater";
}

// ---------- Egne logoer: matcher filnavn («Logo - Chat Noir») mot teaternavn ----------
const LOGO_ALIAS={"oslo nye central":"centralteatret teaterkjellern","oslo nye centralteatret":"centralteatret teaterkjellern","central":"centralteatret teaterkjellern","centralteatret":"centralteatret teaterkjellern","dns":"den nationale scene","neuf":"chateau neuf","opera":"operaen","den norske opera":"operaen","oslo nye":"oslo nye teater","trondelag":"nye trondelag teater","trondelag teater":"nye trondelag teater","nye hjorten":"nye hjorten teater","fjaereheia":"bruddet fjaereheia","bruddet":"bruddet fjaereheia","christiania":"christiania teater","det norske":"det norske teatret"};
const nrm=t=>String(t||"").toLowerCase().replace(/oslonye/g,"oslo nye").replace(/æ/g,"ae").replace(/ø/g,"o").replace(/å/g,"a").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\(.*?\)/g,"").replace(/[^a-z0-9]+/g," ").trim();
function ownLogoFor(name){
  const list=(DATA&&DATA.ownLogos)||[];if(!list.length)return "";
  const n=nrm(name);
  const exact=list.find(l=>{const k=nrm(l.name);return k===n||LOGO_ALIAS[k]===n});
  if(exact)return exact.img;
  const part=list.find(l=>{const k=LOGO_ALIAS[nrm(l.name)]||nrm(l.name);return k.length>3&&(n.startsWith(k)||k.startsWith(n))});
  return part?part.img:"";
}

function renderTheatre(){
  const T=today();let list=[];
  const ALL=Object.entries(DATA).filter(([k,v])=>k!=="films"&&!k.startsWith("k_")&&Array.isArray(v)&&v.length&&v[0].venue).flatMap(([,v])=>v);
  ALL.filter(s=>s.times).forEach(s=>{const times=s.times.map(x=>new Date(x)).filter(t=>t>=T);if(times.length)list.push({...s,times,key:times[0],status:"Neste: "+fmtDT(times[0]),label:s.venue.split(",")[0]})});
  ALL.filter(s=>!s.times).forEach(s=>{
    const label=s.venue.split(",")[0];
    if(s.next){const n=new Date(s.next);if(n<T)return;list.push({...s,key:n,status:"Neste: "+fmtDT(n),label});return}
    if(!s.from){list.push({...s,key:new Date(8.64e15),status:"Se datoer på nettsiden",label});return}
    const f=new Date(s.from+"T00:00"),t=s.to?new Date(s.to+"T23:59"):new Date(8.64e15);if(t<T)return;
    const one=s.from===s.to,now=f<=T;list.push({...s,f,t,key:now?T:f,status:one?fmtD(f):(now?"Spilles nå":"Fra "+fmtDay(f)),label})});
  list.forEach(s=>{s.cat=catOf(s);s.city=s.city||"Oslo";s._t="teater";LIVE[favId("teater",s)]=s});
  list.sort((a,b)=>a.key-b.key);
  const byCity={};list.forEach(s=>byCity[s.city]=(byCity[s.city]||0)+1);
  const HOME_CITY="Oslo";const cities=Object.keys(byCity).sort((a,b)=>(b===HOME_CITY)-(a===HOME_CITY)||a.localeCompare(b,"nb"));
  if(cityFilter!=="Alle"&&!cities.includes(cityFilter))cityFilter="Alle";
  const ce=document.getElementById("cities");ce.innerHTML="";
  ["Alle",...cities].forEach(c=>{const b=document.createElement("button");b.className="chip";b.textContent=c==="Alle"?`Alle byer (${list.length})`:`${c} (${byCity[c]})`;
    b.setAttribute("aria-pressed",c===cityFilter);b.addEventListener("click",()=>{cityFilter=c;catFilter="Alle";venueFilter="Alle";theatreView="logos";pause();renderTheatre()});ce.appendChild(b)});
  const all=list;
  list=cityFilter==="Alle"?all:all.filter(s=>s.city===cityFilter);
  const cityOfTheater={};list.forEach(s=>cityOfTheater[theaterOf(s)]=s.city);
  // teatermeny for valgt by
  const vc={};list.forEach(s=>{const t=theaterOf(s);vc[t]=(vc[t]||0)+1});
  const venues=Object.keys(vc).sort((a,b)=>a.localeCompare(b,"nb"));
  if(venueFilter!=="Alle"&&!venues.includes(venueFilter))venueFilter="Alle";
  const ve=document.getElementById("venues");ve.innerHTML="";
  if(venues.length>1)["Alle",...venues].forEach(v=>{const b=document.createElement("button");b.className="chip";b.textContent=v==="Alle"?`Alle teatre (${list.length})`:`${v} (${vc[v]})`;
    b.setAttribute("aria-pressed",v===venueFilter);b.addEventListener("click",()=>{venueFilter=v;catFilter="Alle";theatreView=v==="Alle"?"logos":"posters";pause();renderTheatre()});ve.appendChild(b)});
  if(venueFilter!=="Alle")list=list.filter(s=>theaterOf(s)===venueFilter);
  const counts={};list.forEach(s=>counts[s.cat]=(counts[s.cat]||0)+1);
  const cats=CATS.filter(c=>c==="Alle"||counts[c]);
  if(!cats.includes(catFilter))catFilter="Alle";
  const fe=document.getElementById("filters");fe.innerHTML="";
  cats.forEach(c=>{const b=document.createElement("button");b.className="chip";b.textContent=c==="Alle"?`Alle (${list.length})`:`${c} (${counts[c]})`;
    b.setAttribute("aria-pressed",c===catFilter);b.addEventListener("click",()=>{catFilter=c;theatreView="posters";pause();renderTheatre()});fe.appendChild(b)});
  const shown=list.filter(s=>catFilter==="Alle"||s.cat===catFilter);
  const el=document.getElementById("posters");el.innerHTML="";
  // Logooversikt: det første man ser på Teater-fanen
  if(theatreView==="logos"&&venueFilter==="Alle"&&catFilter==="Alle"&&venues.length>=1){
    const mk=(name,count,logo,onClick,isAll,isOwn)=>{const b=document.createElement("button");b.className="poster theatre-tile";
      b.innerHTML=`<div class="art logo-art${isAll?" all":""}${isOwn?" own":""}">${isAll?`<span class="all-txt">Alle<br>teatrene</span>`:logo?`<img class="logo" src="${esc(logo)}" alt="" referrerpolicy="no-referrer" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'logo-txt',textContent:${JSON.stringify(name).replace(/"/g,"&quot;")}}))">`:`<span class="logo-txt">${esc(name)}</span>`}</div><div class="meta"><b>${esc(isAll?"Alle teatrene":name)}</b>${count} ${count===1?"forestilling":"forestillinger"}${!isAll&&cityFilter==="Alle"&&cityOfTheater[name]?", "+esc(cityOfTheater[name]):""}</div>`;
      b.addEventListener("click",onClick);el.appendChild(b);};
    if(cityFilter!=="Alle")mk("Alle teatrene",list.length,"",()=>{theatreView="posters";pause();renderTheatre()},true);  // bare når en by er valgt
    venues.forEach(v=>{const own=ownLogoFor(v);mk(v,vc[v],own||(DATA.logos||{})[v],()=>{venueFilter=v;theatreView="posters";pause();renderTheatre()},false,!!own)});
    document.getElementById("srcT").textContent=`Velg et teater, eller «Alle teatrene» for å se alle ${list.length} forestillinger.`;
    return;
  }
  // Del opp med overskrifter: I dag, Spilles nå, Denne uken, Senere, Uten fast dato
  const SECT=["I dag","Spilles nå","Denne uken","Senere","Uten fast dato"];
  const now0=today(),tomorrow=new Date(now0.getTime()+864e5),weekEnd=new Date(now0);weekEnd.setDate(now0.getDate()+((8-now0.getDay())%7||7));
  const sectOf=s=>{
    const t=s.times?s.times[0]:s.next?new Date(s.next):null;
    if(t)return t<tomorrow?0:t<weekEnd?2:3;
    if(!s.from)return 4;
    if(s.f<=now0)return s.from===s.to&&s.f>=now0?0:1;
    return s.f<tomorrow?0:s.f<weekEnd?2:3;
  };
  shown.forEach(s=>s.sect=sectOf(s));
  shown.sort((a,b)=>a.sect-b.sect||a.key-b.key);
  let lastSect=-1;
  shown.forEach(s=>{if(s.sect!==lastSect){lastSect=s.sect;const h=document.createElement("div");h.className="secthead";h.textContent=SECT[s.sect];el.appendChild(h)}
    const b=document.createElement("button");b.className="poster";
    b.innerHTML=`<div class="art">${badgeHtml(s)}<div class="shape" style="${styleFor(s.title)}"></div><h3>${esc(s.title)}</h3>${imgTag(s.img,s.imgAlt)}<span class="kind">${esc(s.label)}</span></div><div class="meta"><b>${esc(s.title)}</b>${esc(s.status)}</div>`;
    b.addEventListener("click",()=>openShow(s));el.appendChild(card(b,"teater",s));});
  document.getElementById("srcT").textContent=list.length?`Kilde: teatrenes egne nettsider og Ticketmaster. Viser ${shown.length} av ${list.length} forestillinger.`:"Fant ingen forestillinger ennå.";
}
const dayLabel=d=>{const t=today(),x=new Date(d+"T00:00"),diff=Math.round((x-t)/864e5);return diff===0?"I dag":diff===1?"I morgen":cap(wd[x.getDay()])+" "+x.getDate()+". "+mon[x.getMonth()]};
const FAV_KINO="Ringen"; // nærmeste kino: vises alltid først når filmen går der
function nextShow(f,kino){const now=new Date();return (f.shows||[]).find(x=>new Date(x.d+"T"+x.t)>=now&&(!kino||x.c===kino))}
let filmFilter="Alle";
function renderFilms(){
  const films=DATA.films||[], counts={};
  films.forEach(f=>{f._t="film";LIVE[favId("film",f)]=f});
  films.forEach(f=>(f.genres||[]).forEach(g=>counts[g]=(counts[g]||0)+1));
  const gs=["Alle",...Object.keys(counts).sort((a,b)=>counts[b]-counts[a])];
  if(!gs.includes(filmFilter))filmFilter="Alle";
  const fe=document.getElementById("fgenres");fe.innerHTML="";
  if(gs.length>1)gs.forEach(g=>{const b=document.createElement("button");b.className="chip";b.textContent=g==="Alle"?`Alle (${films.length})`:`${g} (${counts[g]})`;
    b.setAttribute("aria-pressed",g===filmFilter);b.addEventListener("click",()=>{filmFilter=g;pause();renderFilms()});fe.appendChild(b)});
  const el=document.getElementById("films");el.innerHTML="";
  // Filmer som går i dag øverst (etter klokkeslett), deretter resten
  const tEnd=new Date(today().getTime()+864e5);
  const pick=f=>{const td=(k)=>{const x=nextShow(f,k);return x&&new Date(x.d+"T"+x.t)<tEnd?x:null};return td(FAV_KINO)||td()||nextShow(f,FAV_KINO)||nextShow(f)};
  const ordered=films.filter(f=>filmFilter==="Alle"||(f.genres||[]).includes(filmFilter)).map(f=>{const n=pick(f);const t=n?new Date(n.d+"T"+n.t):new Date(8.64e15);return {f,n,t,isToday:t<tEnd}})
    .sort((a,b)=>(b.isToday-a.isToday)||a.t-b.t);
  let lastH=null;

function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)}
// returnerer {ok, usikker} for om quizen går på dato d
function quizOn(q,d){
  if(d.getDay()!==q.wd)return {ok:false};
  switch(q.rule){
    case "weekly":return {ok:true};
    case "first":return {ok:d.getDate()<=7};
    case "last":return {ok:new Date(d.getFullYear(),d.getMonth(),d.getDate()+7).getMonth()!==d.getMonth()};
    case "odd":return {ok:isoWeek(d)%2===1};
    case "even":return {ok:isoWeek(d)%2===0};
    default:return {ok:true,usikker:true}; // annenhver uke / én gang i måneden: vi vet ikke hvilke uker
  }
}
const ruleText={first:"1. i måneden",last:"siste i måneden",odd:"oddetallsuker",even:"partallsuker",biweekly:"annenhver uke – sjekk",monthly:"én gang i måneden – sjekk"};
function quizWeek(days=7){
  const out=[],t=today();
  for(let k=0;k<days;k++){const d=new Date(t);d.setDate(t.getDate()+k);
    (DATA.quiz||[]).forEach(q=>{const r=quizOn(q,d);if(r.ok)out.push({...q,date:d,usikker:r.usikker,k})})}
  return out.sort((a,b)=>a.date-b.date||a.time.localeCompare(b.time));
}

  const w=DATA&&DATA.weather;if(!w||!w.days)return null;const now=Date.now();
  const hrs=w.days.flatMap(d=>(d.hours||[]).map(h=>({...h,t:new Date(d.date+"T"+String(h.h).padStart(2,"0")+":00")}))).sort((a,b)=>a.t-b.t);

  const ra=(l,b)=>atan2(sin(l)*cos(e)-tan(b)*sin(e),cos(l)),dec=(l,b)=>asin(sin(b)*cos(e)+cos(b)*sin(e)*sin(l));
  const M=d=>R*(357.5291+0.98560028*d),L=m=>m+R*(1.9148*sin(m)+0.02*sin(2*m)+0.0003*sin(3*m))+R*102.9372+PI;
  function sun(date){const lw=R*-LON,phi=R*LAT,d=toDays(date),n=Math.round(d-0.0009-lw/(2*PI)),ds=0.0009+lw/(2*PI)+n,m=M(ds),l=L(m),dc=dec(l,0);
    const noon=2451545+ds+0.0053*sin(m)-0.0069*sin(2*l),w=acos((sin(-0.833*R)-sin(phi)*sin(dc))/(cos(phi)*cos(dc)));
    if(isNaN(w))return null;
    // finjuster med solas deklinasjon akkurat ved oppgang og nedgang
    const ev=sg=>{let j=noon+sg*w/(2*PI);for(let k=0;k<2;k++){const dd=j-2451545,dc2=dec(L(M(dd)),0),w2=acos((sin(-0.833*R)-sin(phi)*sin(dc2))/(cos(phi)*cos(dc2)));if(!isNaN(w2))j=noon+sg*w2/(2*PI)}return fromJ(j)};
    return {rise:ev(-1),set:ev(1)}}
  function moon(date){const d=toDays(date),m=M(d),l=L(m),s={dec:dec(l,0),ra:ra(l,0)};
    const Lm=R*(218.316+13.176396*d),Mm=R*(134.963+13.064993*d),F=R*(93.272+13.229350*d),lo=Lm+R*6.289*sin(Mm),la=R*5.128*sin(F),dist=385001-20905*cos(Mm);
    const mo={ra:ra(lo,la),dec:dec(lo,la)},sd=149598000;
    const phi=acos(sin(s.dec)*sin(mo.dec)+cos(s.dec)*cos(mo.dec)*cos(s.ra-mo.ra)),inc=atan2(sd*sin(phi),dist-sd*cos(phi));

const MOON_NAMES=[[.03,"🌑","Nymåne"],[.22,"🌒","Voksende månesigd"],[.28,"🌓","Første kvarter"],[.47,"🌔","Voksende måne"],[.53,"🌕","Fullmåne"],[.72,"🌖","Minkende måne"],[.78,"🌗","Siste kvarter"],[.97,"🌘","Minkende månesigd"],[1.01,"🌑","Nymåne"]];
const moonName=p=>MOON_NAMES.find(([x])=>p<x);
function nextMoon(target){ // neste fullmåne (0.5) eller nymåne (0/1)
  let t=Date.now(),prev=AST.moon(new Date(t)).phase;
  for(let k=0;k<24*32;k++){t+=36e5;const p=AST.moon(new Date(t)).phase;
    if(target===.5?(prev<.5&&p>=.5):(p<prev))return new Date(t);prev=p}return null}
const hm=d=>d?String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"):"–";
const noon=d=>{const x=new Date(d);x.setHours(12,0,0,0);return x};

function sunFor(d){const iso=ymdOf(d),m=((DATA&&DATA.sun)||[]).find(x=>x.date===iso&&x.rise&&x.set);
  return m?{rise:new Date(m.rise),set:new Date(m.set)}:AST.sun(noon(d))}

// ---------- Helg: fredag–søndag samlet ----------
function weekendRange(){const t=today(),d=t.getDay(); // 5=fre, 6=lør, 0=søn
  const start=new Date(t);if(d>=1&&d<=4)start.setDate(t.getDate()+(5-d));
  const end=new Date(start);end.setDate(start.getDate()+(start.getDay()===0?0:7-start.getDay()));end.setHours(23,59,59,999);
  return {start,end,now:d===5||d===6||d===0}}
function renderWeekend(){
  const el=document.getElementById("weekend");if(!el||!DATA)return;
  const {start,end,now}=weekendRange(),nowT=new Date(),ev=[],ranged=[];
  const inW=t=>t>=start&&t<=end&&t>=new Date(nowT-60*6e4);
  const kindOf=(s,isK)=>s.venue==="Latter"||s.venue==="Chat Noir"?"humor":isK?"konsert":"teater";
  Object.entries(DATA).forEach(([k,v])=>{
    if(k==="films"||!Array.isArray(v)||!v.length||!v[0].venue)return;const isK=k.startsWith("k_");
    v.forEach(s0=>{if(s0.city&&s0.city!=="Oslo")return;
      const s={...s0,_t:isK?"konsert":"teater",label:s0.venue.split(",")[0]};s.cat=catOf(s);const kind=kindOf(s,isK);
      if(kind==="teater")return; // teater vises bare på Teater-fanen
      if(s0.times){const tm=s0.times.map(x=>new Date(x));s.times=tm.filter(t=>t>=today());tm.filter(inW).forEach(t=>ev.push({t,s,kind,time:true}));return}
      if(s0.next){const n=new Date(s0.next);if(inW(n))ev.push({t:n,s,kind,time:true});return}
      if(!s0.from)return;s.f=new Date(s0.from+"T00:00");s.t=s0.to?new Date(s0.to+"T23:59"):null;
      if(s0.from===s0.to){if(s.f>=today()&&s.f>=start&&s.f<=end)ev.push({t:s.f,s,kind,time:false});return}
      if(s.f<=end&&(!s.t||s.t>=start))ranged.push({s,kind})});
  });
  for(let d=new Date(Math.max(start,today()));d<=end;d.setDate(d.getDate()+1))
    (DATA.quiz||[]).forEach(q=>{const r=quizOn(q,d);if(!r.ok)return;const [H,M]=String(q.time).split(":").map(Number);const t=new Date(d);t.setHours(H||19,M||0,0,0);
      if(t>=new Date(nowT-60*6e4))ev.push({t,kind:"quiz",time:true,q:{...q,usikker:r.usikker}})});
  ((DATA&&DATA.loppis)||[]).forEach(l=>(l.dates||[]).forEach(d=>{const x=new Date(d+"T00:00");if(x<start||x>end||x<today())return;
    const [H,M]=String(l.time||"").split(/[–-]/)[0].split(/[.:]/).map(Number);const t=new Date(x);t.setHours(isNaN(H)?10:H,M||0,0,0);ev.push({t,kind:"loppe",time:!!l.time,l})}));
  // tidspunkt først, arrangementer uten klokkeslett sist på dagen
  const sk=x=>x.time?+x.t:+x.t+864e5-1;ev.sort((a,b)=>sk(a)-sk(b));
  const ICON={teater:"🎭",konsert:"🎸",humor:"😂",quiz:"🧠",loppe:"🛍️"};
  const row=x=>{const b=document.createElement("button");b.className="hrow";
    if(x.kind==="quiz"){b.innerHTML=`<div class="th"><span class="ic">🧠</span></div><div><span class="t">${hm(x.t)} · Quiz</span><b>${esc(x.q.place)}</b><small>${esc(x.q.type)}${x.q.usikker?" · "+ruleText[x.q.rule]:""}</small></div>`;
      b.addEventListener("click",()=>document.getElementById("quizbar").click());return b}
    if(x.kind==="loppe"){const l=x.l;b.innerHTML=`<div class="th"><span class="ic">🛍️</span>${imgTag(l.img)}</div><div><span class="t">${l.time?esc(l.time)+" · ":""}🛍️ Loppemarked</span><b>${esc(l.title)}</b><small>${esc(l.place||"")}</small></div>`;
      b.addEventListener("click",()=>window.open(l.url,"_blank","noopener"));return b}
    const s=x.s;b.innerHTML=`<div class="th"><span class="ic">${ICON[x.kind]}</span>${imgTag(s.img,s.imgAlt)}</div><div><span class="t">${x.time?hm(x.t)+" · ":x.ranged?"":"Tid på nettsiden · "}${ICON[x.kind]} ${x.kind==="humor"?"Stand-up":x.kind==="konsert"?"Konsert":esc(s.cat)}</span><b>${esc(s.title)}</b><small>${esc(s.label)}${badgeTxt(s)?" · "+badgeTxt(s):""}</small></div>`;
    b.addEventListener("click",()=>openShow(s));return b};
  el.innerHTML="";
  const ttl=document.createElement("p");ttl.className="src";ttl.style.margin="0 0 6px";
  ttl.textContent=(now?"Denne helgen":"Til helgen")+": "+(ymdOf(start)===ymdOf(end)?`i dag, ${fmtD(start)}`:`${fmtD(start)} – ${fmtD(end)}`)+". Oslo.";el.appendChild(ttl);
  let lastD="";
  ev.forEach(x=>{const d=ymdOf(x.t);if(d!==lastD){lastD=d;const h=document.createElement("div");h.className="wkday";h.textContent=dayLabel(d).replace(/^(\p{L}+) /u,(m,w)=>({fre:"Fredag",lør:"Lørdag",søn:"Søndag"}[w.toLowerCase()]||w)+" ");el.appendChild(h)}
    el.appendChild(row(x))});
  if(!ev.length)el.insertAdjacentHTML("beforeend",`<div class="empty">Fant ingen arrangementer med fast tidspunkt denne helgen.</div>`);
  if(ranged.length){const h=document.createElement("div");h.className="wkday";h.textContent="Spilles i helgen";el.appendChild(h);
    ranged.sort((a,b)=>a.s.title.localeCompare(b.s.title,"nb")).forEach(r=>el.appendChild(row({...r,time:false,ranged:true})))}
  document.getElementById("srcW").textContent=`${ev.length} arrangementer med tidspunkt${ranged.length?` og ${ranged.length} forestillinger som går over flere dager (se tider på nettsiden)`:""}. Teater og kino finner du under egne faner.`;
}

  function showDay(d){
    box.innerHTML=`<div class="fdays">${days.map(x=>`<button class="chip" data-d="${x}" aria-pressed="${x===d}">${dayLabel(x)}</button>`).join("")}</div>`+
      [...new Set(shows.filter(x=>x.d===d).map(x=>x.c))].sort((a,b)=>(b===FAV_KINO)-(a===FAV_KINO)).map(c=>`<div class="cin"><b>${esc(c)}</b><div class="times">${shows.filter(x=>x.d===d&&x.c===c).map(x=>`<a class="time" href="${esc(x.u)}" target="_blank" rel="noopener" title="${esc(x.v)}">${x.t}<small>sal ${esc(x.r)}</small></a>`).join("")}</div></div>`).join("");
    box.querySelectorAll(".chip").forEach(b=>b.addEventListener("click",()=>showDay(b.dataset.d)));
  }
  if(days.length)showDay(days[0]);else box.innerHTML="<li>Ingen flere visninger denne uken.</li>";
  const tb=document.getElementById("mtrailer");
  const sc=[f.rt?`<span class="score">${parseInt(f.rt)>=60?"🍅":"🤢"} ${esc(f.rt)}<small>Rotten Tomatoes</small></span>`:"",f.imdb?`<a class="score" href="https://www.imdb.com/title/${esc(f.imdbId||"")}/" target="_blank" rel="noopener">⭐ ${esc(f.imdb)}<small>IMDb</small></a>`:""].join("");
  document.getElementById("mdesc").insertAdjacentHTML("beforeend",sc?`<div class="scores" style="margin-top:10px">${sc}</div>`:"");
  if(f.trailer){tb.innerHTML=`<button class="trailerbtn">▶ Se trailer</button>`;
    tb.querySelector("button").addEventListener("click",()=>{
      tb.innerHTML=f.trailer.startsWith("yt:")
        ?`<div class="trailerbox"><iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(f.trailer.slice(3))}?autoplay=1&rel=0&playsinline=1" allow="autoplay; encrypted-media; fullscreen" allowfullscreen title="Trailer"></iframe></div>`
        :`<div class="trailerbox"><video src="${esc(f.trailer)}" controls autoplay playsinline></video></div>`;});}
}
function openDay(d,k){pause();const dt=new Date(d.date+"T12:00");
  document.getElementById("wtitle").textContent=k===0?"I dag":`${cap(days[dt.getDay()])} ${dt.getDate()}. ${months[dt.getMonth()]}`;
  document.getElementById("wsum").textContent=`${symText(d.sym)}. ${d.max}° / ${d.min}°${d.rain?", "+fmtMm(d.rain):""}. Grünerløkka.`;
  document.getElementById("wlist").innerHTML=d.hours.map(r=>`<div class="wrow"><span class="t">${String(r.h).padStart(2,"0")}:00</span><span>${sym(r.sym)}</span><span class="c">${r.temp}°</span><span class="r">${fmtMm(r.rain)}</span><span class="w">${r.wind} m/s</span></div>`).join("");
  wmodal.showModal();}
modal.addEventListener("close",()=>{document.getElementById("mtrailer").innerHTML=""});
[["mclose",modal],["wclose",wmodal]].forEach(([id,m])=>{document.getElementById(id).addEventListener("click",()=>m.close());m.addEventListener("click",e=>{if(e.target===m)m.close()})});

// ---------- Skjermsparer ----------
const SAVER=2*60*1000,saver=document.getElementById("saver");let idle=Date.now();
["pointerdown","touchstart","scroll","keydown"].forEach(ev=>addEventListener(ev,()=>{idle=Date.now();if(ev==="pointerdown"&&!saver.classList.contains("on"))pause()},{passive:true}));
// Malerier: bytter hvert minutt med myk overgang
const ART_EVERY=15*60*1000;let artTimer=null,artFront="artA",artOrder=[],artPos=0;
function showArt(){
  const own=(DATA&&DATA.ownArt)||[];const list=own.length?own:((DATA&&DATA.art)||[]);if(!list.length)return;
  if(artOrder.length&&artOrder.some(i=>i>=list.length)){artOrder=[];artPos=0}
  if(artPos>=artOrder.length){artOrder=list.map((_,i)=>i).sort(()=>Math.random()-.5);artPos=0}
  const a=list[artOrder[artPos++]],back=artFront==="artA"?"artB":"artA",el=document.getElementById(back),img=el.querySelector(".pic");
  img.onload=()=>{el.querySelector(".blur").style.backgroundImage=`url('${encodeURI(a.img)}')`;el.classList.add("show");document.getElementById(artFront).classList.remove("show");artFront=back;
    document.getElementById("artCap").innerHTML=a.own?"":`<b>${esc(a.title)}</b>${esc(a.artist)}${a.year?", "+esc(a.year):""}`;};
  img.onerror=()=>{if(artPos<artOrder.length)showArt()};
  img.src=a.img;
}
function saverTemp(){const t=DATA&&DATA.weather&&DATA.weather.now;document.getElementById("stemp").textContent=t?`${t.temp}°`:""}
function startSaver(){saverTemp();if(modal.open)modal.close();if(wmodal.open)wmodal.close();saver.classList.add("on");showArt();clearInterval(artTimer);artTimer=setInterval(()=>{showArt();saverTemp()},ART_EVERY)}
setInterval(()=>{if(saver.classList.contains("on"))saverTemp()},5*60*1000);
function stopSaver(){saver.classList.remove("on");clearInterval(artTimer);idle=Date.now()}
saver.addEventListener("pointerdown",e=>{e.stopPropagation();stopSaver()});
document.getElementById("testSaver").addEventListener("click",e=>{e.stopPropagation();startSaver()});
setInterval(()=>{if(Date.now()-idle>SAVER&&!saver.classList.contains("on")&&!isNight())startSaver()},1000);

// ---------- Nattmodus (23:00–08:00) ----------
// Mellom NIGHT_START og NIGHT_END vises en svak klokke i stedet for bildeskjermsparer.
// I Fully Kiosk (med JavaScript Interface på) skrus lysstyrken ned automatisk.
const NIGHT_START=23,NIGHT_END=8,NIGHT_BRIGHT=12; // lysstyrke 0–255 om natta
const night=document.getElementById("night");let nightTest=false,dayBright=null;
const FK=()=>typeof fully!=="undefined"?fully:null;
function isNight(){const h=new Date().getHours();return nightTest||h>=NIGHT_START||h<NIGHT_END}
function setBright(v){const f=FK();if(!f||v==null)return;try{f.setScreenBrightness(v)}catch(e){}}
function dimScreen(){const f=FK();if(!f)return;try{const b=f.getScreenBrightness();if(b>NIGHT_BRIGHT)dayBright=b}catch(e){}setBright(NIGHT_BRIGHT)}
function brightScreen(){setBright(dayBright==null?200:dayBright)}
function nightFill(){const d=new Date();
  document.getElementById("nclock").textContent=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  document.getElementById("ndate").textContent=`${cap(days[d.getDay()])} ${d.getDate()}. ${months[d.getMonth()]}`;
  const w=DATA&&DATA.weather;document.getElementById("ntemp").textContent=w&&w.now?`${sym(w.now.sym)} ${w.now.temp}°`:"";
  const t=w&&w.days&&w.days.find(x=>x.date>=new Date(Date.now()+(d.getHours()>=NIGHT_START?864e5:0)).toLocaleDateString("sv-SE"));
  document.getElementById("nnext").textContent=t?`${d.getHours()>=NIGHT_START?"I morgen":"I dag"}: ${sym(t.sym)} ${t.max}° / ${t.min}°`:"";}
function startNight(){if(night.classList.contains("on"))return;if(saver.classList.contains("on")){saver.classList.remove("on");clearInterval(artTimer)}
  if(modal.open)modal.close();if(wmodal.open)wmodal.close();nightFill();night.classList.add("on");dimScreen()}
function stopNight(){if(!night.classList.contains("on"))return;night.classList.remove("on");brightScreen();idle=Date.now()}
night.addEventListener("pointerdown",e=>{e.stopPropagation();stopNight()});
// flytter klokka litt hvert 10. minutt så skjermen ikke får innbrent bilde
setInterval(()=>night.style.setProperty("--ny",(34+Math.random()*14).toFixed(1)+"%"),10*60*1000);
setInterval(()=>{
  if(night.classList.contains("on")){nightFill();if(!isNight())stopNight()}
  else if(isNight()&&Date.now()-idle>SAVER)startNight();
},1000);
document.getElementById("testNight").addEventListener("click",e=>{e.stopPropagation();nightTest=true;startNight();
  setTimeout(()=>{nightTest=false;if(!isNight())stopNight()},60*1000)});
if(isNight())startNight();


</script>
